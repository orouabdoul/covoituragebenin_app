name: covoiturage_benin_app
description: "MINIZON — Application de covoiturage au Bénin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  file_selector: ^1.0.3
  dio: ^5.8.0
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  logger: ^2.7.0
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  image: ^4.1.7
  face_detection_tflite: ^6.6.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^18.0.1
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_tts: ^4.0.0
  record: ^5.2.0
  path_provider: ^2.1.5

dependency_overrides:
  record_linux: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/minizon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/minizon/icon.png"
  web:
    generate: false

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/operators/
    - assets/minizon/
